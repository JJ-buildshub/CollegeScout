# A Next.js build can succeed and still ship a broken page. That happened on
# this project: a font change compiled cleanly, deployed, and rendered an empty
# body. HTTP 200, no build error, nothing to notice. This checks what the live
# site actually serves after a deploy, not whether the build exited zero.
name: Post-deploy check

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for this commit to go live, then check what the site serves
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module -e '
          const ROUTES = [
            ["home",      "https://collegescout.app/",                                 2000],
            ["directory", "https://collegescout.app/directory",                        5000],
            ["profile",   "https://collegescout.app/directory/stanford-university",    3000],
            ["my fit",    "https://collegescout.app/matcher",                          1500],
            ["my plan",   "https://collegescout.app/checklist",                         500],
            ["scholarships", "https://collegescout.app/scholarships",                  5000],
            ["about",     "https://collegescout.app/about-data",                        800],
            ["sitemap",   "https://collegescout.app/sitemap.xml",                      1000],
          ];

          const get = async (url) => {
            const r = await fetch(url, { redirect: "follow", cache: "no-store",
              headers: { "User-Agent": "collegescout-post-deploy-check" } });
            return { status: r.status, body: await r.text(), url: r.url };
          };

          // The old deployment keeps serving a healthy homepage until the new
          // one takes over, so "returns 200" proves nothing about this push. On
          // 2026-10-19 the run for dc906ff went green while the live pages still
          // showed old data. Instead, wait until the page names this commit in
          // its build-sha tag (set from VERCEL_GIT_COMMIT_SHA in app/layout.tsx).
          const expected = process.env.EXPECTED_SHA;
          const shaOf = (html) => {
            const m = html.match(/<meta[^>]*name="build-sha"[^>]*content="([0-9a-f]+)"/i);
            return m ? m[1] : null;
          };
          let live = null;
          for (let i = 0; i < 40 && live !== expected; i++) {
            try {
              const r = await get(ROUTES[0][1] + "?deploy-check=" + Date.now());
              if (r.status === 200) live = shaOf(r.body);
            } catch {}
            if (live !== expected) await new Promise((r) => setTimeout(r, 15000));
          }
          if (live !== expected) {
            console.error(`After 10 minutes the live site is still not running commit ${expected}.`);
            console.error(live
              ? `It is serving ${live}. Either Vercel has not finished (or failed) this build, or a later push replaced it.`
              : "The homepage carries no build-sha tag, so there is no way to tell which build is live. Check the Vercel dashboard.");
            process.exit(1);
          }
          console.log(`Commit ${expected} is live. Checking routes.`);

          const problems = [];
          for (const [name, url, minChars] of ROUTES) {
            try {
              const r = await get(url);
              if (r.status !== 200) { problems.push(`${name}: HTTP ${r.status}`); continue; }
              // The empty-page failure mode: a 200 with nothing rendered in it.
              if (r.body.length < minChars) problems.push(`${name}: only ${r.body.length} bytes, expected at least ${minChars}`);
              if (!url.endsWith(".xml") && !r.body.includes("CollegeScout")) problems.push(`${name}: page content missing`);
            } catch (e) {
              problems.push(`${name}: request failed - ${(e.cause && e.cause.code) || e.message}`);
            }
          }

          if (problems.length) {
            console.error("The deploy is live but these routes are wrong:");
            problems.forEach((p) => console.error("  - " + p));
            process.exit(1);
          }
          console.log("All " + ROUTES.length + " routes serving correctly.");
          '
