# Colleges change their own pages, and when they do our stored quote stops
# matching. That is the only signal we get that a record has gone stale.
# Measured drift is roughly one page in 250 per week; one in 750 changes in a
# way that alters the answer. Over a nine-month admissions cycle that is enough
# wrong records to matter, and nothing else surfaces them.
name: Data decay check

on:
  schedule:
    # 06:17 UTC on Mondays, which is Sunday night Pacific. Off-the-hour
    # deliberately: every scheduled job in the world fires at :00, and GitHub
    # delays runs when its queue is busy.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    # Naming the shell turns on pipefail. Without it a step ending in "| tee"
    # reports tee's exit code, which is always zero: the checkers failed and
    # the step passed, so the issue below was never opened.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The verifiers import only Node builtins, so there is nothing to install.
      - name: Re-check every recorded testing-policy quote
        id: policies
        continue-on-error: true
        run: node scripts/check-reviewed-test-policies.mjs 2>&1 | tee policies.txt

      - name: Re-check every recorded deadline quote
        id: deadlines
        continue-on-error: true
        run: node scripts/check-reviewed-deadlines.mjs 2>&1 | tee deadlines.txt

      - name: Re-check every quoted essay prompt
        id: applications
        continue-on-error: true
        run: node scripts/check-applications.mjs 2>&1 | tee applications.txt

      - name: Re-check every quoted UC, CSU and application-system rule
        id: systems
        continue-on-error: true
        run: node scripts/check-system-requirements.mjs 2>&1 | tee systems.txt

      - name: Re-check every quoted scholarship rule
        id: scholarships
        continue-on-error: true
        run: node scripts/check-scholarships.mjs 2>&1 | tee scholarships.txt

      - name: Re-check every quoted state aid rule
        id: stateaid
        continue-on-error: true
        run: node scripts/check-state-aid.mjs 2>&1 | tee stateaid.txt

      - name: Re-check every quoted talent pathway source
        id: pathways
        continue-on-error: true
        run: node scripts/check-pathways.mjs 2>&1 | tee pathways.txt

      # Many schools refuse automated requests outright: about twenty answer
      # 403 or 429 on any given run, and Princeton's site is not down. Only two
      # results say the stored link itself is wrong: the page is gone, or the
      # school now lives on a different domain. Report those and nothing else,
      # or this issue would be opened every week and stop being read.
      - name: Re-check every school's website link
        id: websites
        continue-on-error: true
        run: |
          node scripts/check-college-websites.mjs > websites-all.txt 2>&1 || true
          head -n 1 websites-all.txt
          grep -E "^- .(domain-changed|fail)\]" websites-all.txt > websites-flagged.txt || true
          grep -E "domain-changed|HTTP (404|410)" websites-flagged.txt > websites.txt || true
          cat websites.txt
          test ! -s websites.txt

      - name: Open an issue if any page stopped matching
        if: >-
          steps.policies.outcome == 'failure' || steps.deadlines.outcome == 'failure' ||
          steps.applications.outcome == 'failure' || steps.systems.outcome == 'failure' ||
          steps.scholarships.outcome == 'failure' || steps.stateaid.outcome == 'failure' ||
          steps.pathways.outcome == 'failure' ||
          steps.websites.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "A college changed a page we quote. Each line below is a stored"
            echo "quote that no longer appears on the school's own page."
            echo
            echo "A failure does not always mean the data is wrong. Most are"
            echo "rewordings. Check what the page says now before changing a value:"
            echo "the policy or date may be unchanged and only the sentence moved."
            echo
            echo "### Testing policies"
            echo '```'
            grep -E "NOT FOUND|could not load|matched their school page" policies.txt || echo "(no output)"
            echo '```'
            echo
            echo "### Deadlines"
            echo '```'
            grep -E "NOT FOUND|could not load|matched their school page" deadlines.txt || echo "(no output)"
            echo '```'
            echo
            echo "### Essay prompts"
            echo '```'
            grep -E "NOT FOUND|could not load|matched their source page" applications.txt || echo "(no output)"
            echo '```'
            echo
            echo "### UC, CSU and application-system rules"
            echo '```'
            grep -E "NOT FOUND|could not load|matched their source page" systems.txt || echo "(no output)"
            echo '```'
            echo
            echo "### Scholarships"
            echo '```'
            grep -E "NOT FOUND|could not load|matched their school page" scholarships.txt || echo "(no output)"
            echo '```'
            echo
            echo "### State aid"
            echo '```'
            grep -E "NOT FOUND|could not load|matched their school page" stateaid.txt || echo "(no output)"
            echo '```'
            echo
            echo "### Talent pathways"
            echo '```'
            grep -E "NOT FOUND|could not load|matched their school page" pathways.txt || echo "(no output)"
            echo '```'
            echo
            echo "### School website links that are gone or have moved domain"
            echo '```'
            grep . websites.txt || echo "(none)"
            echo '```'
            echo
            echo "Fix policies and deadlines by updating the quote in \`data/reviewed-*.json\`,"
            echo "re-running the checker, then \`python scripts/apply-reviewed-*.py --apply\`."
            echo "Essay prompts, system rules and website links are edited directly in"
            echo "\`data/applications.json\`, \`data/system-requirements.json\`,"
            echo "\`data/scholarships.json\`, \`data/state-aid.json\`, \`data/pathways.json\` and \`data/colleges.json\`."
          } > body.md
          gh issue create \
            --title "Data decay: a college changed a page we quote ($(date -u +%Y-%m-%d))" \
            --body-file body.md \
            --label "data" || gh issue create \
            --title "Data decay: a college changed a page we quote ($(date -u +%Y-%m-%d))" \
            --body-file body.md
